[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "natureformat"
version = "0.1.0"
description = "One-click Nature final-artwork restyler for already-assembled figures."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.2"]

[project.scripts]
natureformat = "natureformat.cli:main"

[tool.setuptools.packages.find]
include = ["natureformat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
